<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>City Tycoon Party — Board Game Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --wood:#2b180e;--wood2:#51301d;--felt:#0d3b2e;--felt2:#145642;
  --gold:#f5c84b;--gold2:#d99d22;--cream:#fff6df;--ink:#24170d;
  --panel:#20150fee;--panel2:#302015;--line:#755031;--txt:#f7ead5;
  --muted:#cbb89b;--ok:#4fc58a;--bad:#e45b52;--blue:#62b8e8;
}
*{box-sizing:border-box}html,body{min-height:100%;margin:0}
body{font-family:Kanit,sans-serif;color:var(--txt);background:
radial-gradient(circle at 50% -10%,#70461f 0,#2b180e 35%,#120a05 100%);
-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit}
button{cursor:pointer}.wrap{max-width:980px;margin:auto;padding:16px 12px 42px}
h1,h2,h3,p{margin:0}.center{text-align:center}.hidden{display:none}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);
border-radius:20px;padding:18px;box-shadow:0 12px 35px #0008,inset 0 1px #fff1}
.btn{border:0;border-radius:13px;padding:11px 16px;font-weight:800;font-size:14px;
box-shadow:0 4px 0 #0005;transition:.12s}.btn:active{transform:translateY(3px);box-shadow:0 1px #0005}
.btn:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}.gold{background:linear-gradient(#ffe07a,#d99d22);color:#2a1b08}
.green{background:linear-gradient(#6be0a4,#329667);color:#06281b}.red{background:linear-gradient(#ef7b72,#c7473d);color:#300a08}
.ghost{background:#0005;color:var(--txt);border:1px solid var(--line)}
input,select{width:100%;background:#0006;color:var(--txt);border:1px solid var(--line);border-radius:11px;padding:11px 12px;font-size:14px}
label{display:block;color:var(--muted);font-size:12px;margin:10px 0 4px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:110px}
.title{font-size:30px;font-weight:800;color:var(--gold)}.sub{color:var(--muted);font-size:13px}
.lights{display:flex;justify-content:center;gap:14px;margin:5px 0 14px}.lights i{width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px #f5c84b;display:block}
.top{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.phase{background:var(--gold);color:var(--ink);border-radius:20px;padding:5px 13px;font-size:12px;font-weight:800}
.code{border:1px dashed var(--gold);background:#0006;border-radius:11px;padding:5px 12px;letter-spacing:3px;font-weight:800}
.players{display:flex;gap:9px;overflow-x:auto;padding:5px 2px 12px}
.player{min-width:118px;position:relative;text-align:center;background:#0005;border:1px solid var(--line);border-radius:15px;padding:9px}
.player.me{border-color:var(--gold);box-shadow:0 0 0 2px #f5c84b30}.player.active{border-color:var(--ok);box-shadow:0 0 13px #4fc58a70}
.av{font-size:25px}.pname{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mini{font-size:11px;color:var(--gold)}
.badge{font-size:10px;border-radius:8px;padding:2px 6px;background:var(--ok);color:#06281b;position:absolute;right:4px;top:4px;font-weight:800}
.badge.wait{background:#000b;color:var(--muted)}
.resources{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:10px 0}
.resbox{background:#0005;border:1px solid #fff1;border-radius:12px;padding:8px;text-align:center}.resbox b{display:block;font-size:18px;color:var(--gold)}
.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.section-title h3{font-size:17px}
.phasebar{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:10px 0 14px}.step{padding:7px 4px;text-align:center;border-radius:9px;background:#0004;border:1px solid #fff1;font-size:11px;color:var(--muted)}
.step.on{background:#f5c84b;color:var(--ink);font-weight:800;border-color:var(--gold)}
.hand{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.playing-card{min-height:145px;background:linear-gradient(145deg,#fff9e9,#e6d4af);color:var(--ink);
border-radius:14px;padding:10px;position:relative;box-shadow:0 7px 14px #0006;border:3px solid #fff;cursor:pointer}
.playing-card .icon{font-size:32px}.playing-card .cn{font-weight:800;font-size:13px}.playing-card .cd{font-size:10px;color:#66533b;margin-top:4px}
.playing-card.obstacle{background:linear-gradient(145deg,#ffe1dc,#e9b0aa)}.playing-card.selected{outline:3px solid var(--gold);transform:translateY(-4px)}
.tag{position:absolute;right:6px;top:6px;font-size:9px;padding:2px 5px;border-radius:6px;background:#0002;font-weight:800}
.auction-card{max-width:360px;margin:auto;background:linear-gradient(145deg,#fffaf0,#ead9b8);color:var(--ink);border-radius:20px;padding:20px;text-align:center;border:5px solid #fff;box-shadow:0 12px 25px #0008}
.auction-card .icon{font-size:52px}.auction-card h2{font-size:22px}.auction-card .cost{font-size:12px;color:#65513a;margin-top:5px}
.bidbox{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:12px}.bidbox input{font-size:18px;text-align:center}
.hidden-status{font-size:12px;color:var(--muted);text-align:center;margin-top:8px}
.reveal{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:7px;margin-top:12px}
.bidresult{border:1px solid var(--line);background:#0005;border-radius:12px;padding:9px;text-align:center}.bidresult.win{border-color:var(--gold);background:#6a4a1420}
.board{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}.tile{aspect-ratio:1;background:linear-gradient(#214c3c,#0e3227);border:1px solid #fff2;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.tile .icon{font-size:15px}.tile small{font-size:6px;color:#ddd}
.inventory{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px}.building{background:#0005;border:1px solid var(--line);border-radius:13px;padding:10px}
.building.selected{border-color:var(--gold);box-shadow:0 0 0 2px #f5c84b30}.building h4{margin:0;font-size:13px}.building small{color:var(--muted)}
.trade-list{display:grid;gap:8px}.trade{background:#0005;border:1px solid var(--line);border-radius:12px;padding:10px}
.log{font-size:12px;color:#dbcbb4;display:grid;gap:3px}.notice{padding:10px;border-radius:11px;background:#0005;border:1px solid #fff1;font-size:13px}
.err{background:#5a201c;border:1px solid var(--bad);padding:10px;border-radius:11px;color:#ffd8d4;font-size:13px}
@media(max-width:650px){.hand{grid-template-columns:repeat(2,1fr)}.resources{grid-template-columns:repeat(3,1fr)}.board{grid-template-columns:repeat(6,1fr)}.playing-card{min-height:125px}.wrap{padding:10px 9px 35px}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="card center">⏳ กำลังเชื่อมต่อ...</div></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {getFirestore,doc,getDoc,setDoc,updateDoc,onSnapshot,runTransaction}
from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

/* ===================== FIREBASE ===================== */
const firebaseConfig={
  apiKey: "AIzaSyB2xwjr4nxGHQX6MUoxs2q9X8U3jjRnKB8",
  authDomain: "city-tycoon-game-a4928.firebaseapp.com",
  projectId: "city-tycoon-game-a4928",
  storageBucket: "city-tycoon-game-a4928.appspot.com",
  messagingSenderId: "365487358268",
  appId: "1:365487358268:web:03a38434443c5678191e39"
};
let db=null;
if(firebaseConfig.apiKey!=="YOUR_API_KEY") db=getFirestore(initializeApp(firebaseConfig));

/* ===================== GAME DATA ===================== */
const RES={
 wood:{n:"ไม้",i:"🪵",sell:2},brick:{n:"อิฐ",i:"🧱",sell:2},
 energy:{n:"ไฟฟ้า",i:"⚡",sell:3},gold:{n:"เงิน",i:"💰"}
};
const BUILDINGS=[
 {n:"บ้านจัดสรร",ic:"🏠",d:"อาคารเริ่มต้น",pts:15,cost:{wood:2,brick:1,energy:0,gold:5}},
 {n:"ห้างสรรพสินค้า",ic:"🏬",d:"อาคารขนาดกลาง",pts:30,cost:{wood:4,brick:3,energy:2,gold:15}},
 {n:"ตึกระฟ้าคริสตัล",ic:"🏙️",d:"อาคารขนาดใหญ่",pts:50,cost:{wood:6,brick:4,energy:3,gold:25}}
];
const DECK=[
 {id:"wood",ic:"🪵",n:"กองไม้ริมป่า",type:"resource",desc:"รับไม้ +3",eff:{wood:3},w:4},
 {id:"brick",ic:"🧱",n:"รถขนอิฐ",type:"resource",desc:"รับอิฐ +3",eff:{brick:3},w:4},
 {id:"energy",ic:"⚡",n:"แผงโซลาร์เซลล์",type:"resource",desc:"รับไฟฟ้า +2",eff:{energy:2},w:3},
 {id:"money",ic:"💰",n:"โบนัสรัฐบาล",type:"resource",desc:"รับเงิน +10",eff:{gold:10},w:3},
 {id:"gift",ic:"🎁",n:"ของขวัญปริศนา",type:"resource",desc:"ไม้ +1 อิฐ +1 ไฟฟ้า +1 เงิน +5",eff:{wood:1,brick:1,energy:1,gold:5},w:2},
 {id:"thief",ic:"🕵️",n:"โจรกลางคืน",type:"obstacle",desc:"ขโมยเงิน 6 จากผู้เล่นที่เลือก"},
 {id:"rat",ic:"🐀",n:"หนูแทะไม้",type:"obstacle",desc:"ขโมยไม้ 3 จากผู้เล่นที่เลือก"},
 {id:"storm",ic:"🌪️",n:"พายุถล่มเมือง",type:"obstacle",desc:"ผู้เล่นที่เลือกเสียอิฐ 2"},
 {id:"blackout",ic:"🔌",n:"ไฟดับทั้งเมือง",type:"obstacle",desc:"ผู้เล่นที่เลือกเสียไฟฟ้า 2"},
 {id:"swap",ic:"🔄",n:"สลับโชคชะตา",type:"obstacle",desc:"สลับเงินกับผู้เล่นที่เลือก"}
];
const AV=["🧑‍🚀","🧑‍🎤","🧑‍🌾","🧑‍🔧","🧑‍🎨","🧑‍🚒"];
const BOARD_N=24;
let uid=null,room=null,code=null,unsub=null,joinMode=null,newMaxP=4,err="",selectedCard=null,selectedBuilding=null;
let winMode="score",winScore=100,winHouse=2,winMid=1,winLarge=1,winGold=50,pendingWin=null,winPopupSeen=false;
const RESALE_MULT=1.5;

/* ===================== HELPERS ===================== */
const esc=s=>(s??"").toString().replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
const roomRef=()=>doc(db,"rooms",code);
const me=()=>room?.players?.find(p=>p.uid===uid);
const weightedCard=()=>{let a=[];DECK.forEach(c=>{for(let i=0;i<(c.w||1);i++)a.push(c)});return a[Math.floor(Math.random()*a.length)]};
const canAfford=(r,c)=>Object.entries(c).every(([k,v])=>(r[k]||0)>=v);
const logAdd=(msg)=>[msg,...(room?.log||[])].slice(0,10);
function playerName(u){return room.players.find(p=>p.uid===u)?.name||"ผู้เล่น"}
async function patch(x){await updateDoc(roomRef(),x)}
function phaseLabel(){return {draw:"🃏 จั่วการ์ด",trade:"🤝 ซื้อขายทรัพยากร",resale:"🏷️ ประมูลทรัพย์สิน",auction:"🔨 ประมูลอาคาร",play:"🏗️ สร้าง / เล่นการ์ด"}[room.roundPhase]||""}

/* ===================== ROOM ===================== */
function genCode(){const c="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";return Array.from({length:4},()=>c[Math.floor(Math.random()*c.length)]).join("")}
function blankPlayer(name){
 return {uid,name:name||"ผู้เล่น",resources:{wood:5,brick:5,energy:3,gold:30},score:0,
 cards:[],buildings:[],drawDone:false,tradeDone:false,resaleDone:false,playDone:false};
}
async function createRoom(name){
 err="";if(!db){err="ยังไม่ได้ตั้งค่า Firebase";render();return}
 const c=genCode(),p=blankPlayer(name);
 const data={code:c,hostUid:uid,maxPlayers:newMaxP,started:false,round:1,roundPhase:"draw",
 players:[p],board:Array(BOARD_N).fill(null),log:[],auction:{buildingIndex:0,bids:{},revealed:false,result:null},
 offers:[],listings:[],gameOver:false,winnerUid:null,
 win:pendingWin||{type:"score",target:100}};
 await setDoc(doc(db,"rooms",c),data);code=c;localStorage.setItem("ctp_code",c);localStorage.setItem("ctp_name",name||"");subscribe();
}
async function joinRoom(c,name){
 err="";if(!db){err="ยังไม่ได้ตั้งค่า Firebase";render();return}
 c=(c||"").toUpperCase().trim();let d=await getDoc(doc(db,"rooms",c));
 if(!d.exists()){err="ไม่พบห้องนี้";render();return}
 let data=d.data();if(!data.players.some(p=>p.uid===uid)){
   if(data.started){err="เกมเริ่มแล้ว เข้าร่วมไม่ได้";render();return}
   if(data.players.length>=data.maxPlayers){err="ห้องเต็มแล้ว";render();return}
   data.players.push(blankPlayer(name));await updateDoc(doc(db,"rooms",c),{players:data.players});
 }
 code=c;localStorage.setItem("ctp_code",c);localStorage.setItem("ctp_name",name||"");subscribe();
}
function subscribe(){
 if(unsub)unsub();unsub=onSnapshot(roomRef(),s=>{if(!s.exists()){leave();return}room=s.data();render()},e=>{err="เชื่อมต่อขัดข้อง: "+e.message;render()});
}
function leave(){if(unsub)unsub();unsub=null;room=null;code=null;winPopupSeen=false;localStorage.removeItem("ctp_code");render()}
async function startGame(){
 if(room.players.length<2)return;
 const players=room.players.map(p=>({...p,resources:{wood:5,brick:5,energy:3,gold:30},cards:[],buildings:[],drawDone:false,tradeDone:false,resaleDone:false,playDone:false}));
 await patch({started:true,round:1,roundPhase:"draw",players,log:["🎬 เริ่มเกม — ทุกคนได้รับทรัพยากรและเงินเท่ากัน"]});
}

/* ===================== DRAW 5 ===================== */
async function drawFive(){
 const p=me();if(!p||room.roundPhase!=="draw"||p.drawDone)return;
 const cards=Array.from({length:5},weightedCard).map(c=>({id:"k"+Date.now()+Math.random().toString(36).slice(2,7),cardId:c.id,ic:c.ic,n:c.n,type:c.type,desc:c.desc,eff:c.eff||null}));
 const players=room.players.map(x=>x.uid===uid?{...x,cards:[...(x.cards||[]),...cards],drawDone:true}:x);
 const all=players.every(x=>x.drawDone);
 const pch={players,log:[`🃏 ${p.name} จั่วการ์ด 5 ใบ`,...(room.log||[])].slice(0,10)};
 if(all)pch.roundPhase="trade",pch.players=players.map(x=>({...x,tradeDone:false}));
 await patch(pch);
}

/* ===================== RESOURCE TRADING ===================== */
async function bankSell(res,qty){
 qty=Number(qty);const p=me();if(!RES[res]||qty<=0||p.resources[res]<qty)return;
 const r={...p.resources,[res]:p.resources[res]-qty,gold:p.resources.gold+qty*RES[res].sell};
 await patch({players:room.players.map(x=>x.uid===uid?{...x,resources:r}:x),
 log:logAdd(`🏦 ${p.name} ขาย${RES[res].n} ${qty} ให้ธนาคาร ได้ ${qty*RES[res].sell}💰`)});
}
async function sendOffer(target,res,qty,price){
 qty=Number(qty);price=Number(price);const p=me();
 if(!target||target===uid||!RES[res]||qty<=0||price<0||p.resources[res]<qty)return;
 const offer={id:"o"+Date.now()+Math.random().toString(36).slice(2,7),from:uid,to:target,res,qty,price,status:"pending"};
 await patch({offers:[...(room.offers||[]),offer]});
}
async function answerOffer(id,accept){
 const fresh=await getDoc(roomRef());if(!fresh.exists())return;const r=fresh.data();
 const offer=(r.offers||[]).find(o=>o.id===id);if(!offer||offer.to!==uid||offer.status!=="pending")return;
 const buyer=r.players.find(p=>p.uid===offer.to),seller=r.players.find(p=>p.uid===offer.from);
 let players=r.players,offers=(r.offers||[]).map(o=>o.id===id?{...o,status:accept?"accepted":"rejected"}:o);
 if(accept && buyer.resources.gold>=offer.price && seller.resources[offer.res]>=offer.qty){
   players=players.map(p=>{
     if(p.uid===offer.from)return {...p,resources:{...p.resources,[offer.res]:p.resources[offer.res]-offer.qty,gold:p.resources.gold+offer.price}};
     if(p.uid===offer.to)return {...p,resources:{...p.resources,[offer.res]:p.resources[offer.res]+offer.qty,gold:p.resources.gold-offer.price}};
     return p;
   });
 }
 await updateDoc(roomRef(),{players,offers,log:[accept?`🤝 ${seller.name} ขาย${RES[offer.res].n} ${offer.qty} ให้ ${buyer.name} ราคา ${offer.price}💰`:`❌ ${seller.name} ปฏิเสธข้อเสนอจาก ${buyer.name}`,...(r.log||[])].slice(0,10)});
}
async function finishTrade(){
 const p=me();if(room.roundPhase!=="trade"||p.tradeDone)return;
 const players=room.players.map(x=>x.uid===uid?{...x,tradeDone:true}:x),all=players.every(x=>x.tradeDone);
 await patch({players,roundPhase:all?"resale":"trade"});
}

/* ===================== BLIND AUCTION ===================== */
async function submitBid(amount){
 amount=Number(amount);const p=me();const a=room.auction||{};
 if(room.roundPhase!=="auction"||a.revealed||a.bids[uid]!==undefined||amount<0||amount>p.resources.gold)return;
 const fresh=await getDoc(roomRef());if(!fresh.exists())return;const r=fresh.data(),au=r.auction||{};
 const bids={...(au.bids||{}),[uid]:amount};
 const players=r.players;
 if(Object.keys(bids).length===players.length){
   const positive=Object.entries(bids).filter(([u,v])=>Number(v)>0).sort((x,y)=>Number(y[1])-Number(x[1]));
   const winner=positive[0]?.[0]||null,price=winner?Number(positive[0][1]):0;
   const tied=positive.filter(x=>Number(x[1])===price);
   const win=tied.length? tied[0][0]:winner;
   let ps=players;
   if(win&&price>0)ps=players.map(x=>x.uid===win?{...x,resources:{...x.resources,gold:x.resources.gold-price},buildings:[...(x.buildings||[]),{buildingIndex:au.buildingIndex,id:"b"+Date.now()+Math.random().toString(36).slice(2,7)}]}:x);
   const b=BUILDINGS[au.buildingIndex];
   await updateDoc(roomRef(),{players:ps,auction:{...au,bids,revealed:true,result:{winnerUid:win,price}},log:[win?`🔨 ${playerName(win)} ชนะ "${b.n}" ด้วย ${price}💰`:`🔨 ไม่มีผู้ชนะการประมูล "${b.n}"`,...(r.log||[])].slice(0,10)});
 }else await updateDoc(roomRef(),{auction:{...au,bids}});
}
async function nextAuction(){
 if(!room.auction?.revealed)return;
 const next=(room.auction.buildingIndex||0)+1;
 if(next>=BUILDINGS.length){
   await patch({roundPhase:"play",players:room.players.map(p=>({...p,playDone:false}))});
 }else await patch({auction:{buildingIndex:next,bids:{},revealed:false,result:null}});
}

/* ===================== PLAY / BUILD ===================== */
async function buildSelected(){
 const p=me();if(room.roundPhase!=="play"||p.playDone||!selectedBuilding)return;
 const inv=p.buildings?.[selectedBuilding];if(!inv)return;
 const b=BUILDINGS[inv.buildingIndex];if(!canAfford(p.resources,b.cost))return;
 const empty=room.board.findIndex(x=>!x);if(empty<0)return;
 const board=[...room.board];board[empty]={ic:b.ic,owner:p.name,ownerUid:uid,n:b.n,cost:b.cost,pts:b.pts,buildIndex:inv.buildingIndex};
 const players=room.players.map(x=>x.uid===uid?{...x,resources:Object.fromEntries(Object.keys(x.resources).map(k=>[k,x.resources[k]-b.cost[k]])),score:x.score+b.pts,buildings:x.buildings.filter((_,i)=>i!==Number(selectedBuilding))}:x);
 selectedBuilding=null;await patch({board,players,log:logAdd(`🏗️ ${p.name} สร้าง "${b.n}" +${b.pts}⭐`)});
 checkWin(players,board);
}
function buybackValue(cost){
 if(!cost)return 0;
 const resVal=(cost.wood||0)*RES.wood.sell+(cost.brick||0)*RES.brick.sell+(cost.energy||0)*RES.energy.sell;
 return Math.round((cost.gold||0)+0.5*resVal);
}
function checkWin(players,board){
 const win=room.win||{type:"score",target:100};let winner=null;
 for(const pl of players){
   if(win.type==="score"){if(pl.score>=win.target){winner=pl.uid;break}}
   else{
     const cnt={0:0,1:0,2:0};board.forEach(t=>{if(t&&t.ownerUid===pl.uid)cnt[t.buildIndex]=(cnt[t.buildIndex]||0)+1});
     if(cnt[0]>=win.house&&cnt[1]>=win.mid&&cnt[2]>=win.large&&pl.resources.gold>=win.gold){winner=pl.uid;break}
   }
 }
 if(winner)patch({gameOver:true,winnerUid:winner});
}

async function listBuilding(idx){
 const p=me();if(room.roundPhase!=="resale"||p.resaleDone)return;
 const t=room.board[idx];if(!t||t.ownerUid!==uid)return;
 if((room.listings||[]).some(l=>l.tile===idx&&!l.closed))return;
 const price=Math.round((t.cost?.gold||0)*RESALE_MULT);
 const listing={id:"l"+Date.now()+Math.random().toString(36).slice(2,6),tile:idx,sellerUid:uid,startPrice:price,bids:{},building:t,closed:false};
 await patch({listings:[...(room.listings||[]),listing],log:logAdd(`🏷️ ${p.name} เปิดประมูล "${t.n}" ที่ ${price}💰 (1.5 เท่าของราคากลาง)`)});
}
async function bidListing(id,amount){
 amount=Number(amount);
 if(room.roundPhase!=="resale")return;
 const fresh=await getDoc(roomRef());if(!fresh.exists())return;const r=fresh.data();
 const listings=r.listings||[],l=listings.find(x=>x.id===id),buyer=r.players.find(x=>x.uid===uid);
 const top=Math.max(0,...Object.values(l?.bids||{}));
 if(!l||l.closed||l.sellerUid===uid||!buyer||amount<l.startPrice||amount<=top||amount>buyer.resources.gold)return;
 await updateDoc(roomRef(),{listings:listings.map(x=>x.id===id?{...x,bids:{...x.bids,[uid]:amount}}:x)});
}
async function finishResale(){
 const p=me();if(room.roundPhase!=="resale"||p.resaleDone)return;
 const players=room.players.map(x=>x.uid===uid?{...x,resaleDone:true}:x);
 if(!players.every(x=>x.resaleDone)){await patch({players});return}
 const fresh=await getDoc(roomRef());if(!fresh.exists())return;const r=fresh.data();
 let board=[...r.board],ps=r.players.map(x=>x.uid===uid?{...x,resaleDone:true}:x),log=[...(r.log||[])];
 (r.listings||[]).filter(l=>!l.closed).forEach(l=>{
   const bids=Object.entries(l.bids||{});
   if(bids.length){
     const [winUid,price]=bids.sort((a,b)=>b[1]-a[1])[0],pr=Number(price);
     ps=ps.map(x=>{
       if(x.uid===l.sellerUid)return{...x,resources:{...x.resources,gold:x.resources.gold+pr}};
       if(x.uid===winUid)return{...x,resources:{...x.resources,gold:x.resources.gold-pr},score:x.score+(l.building.pts||0)};
       return x;
     });
     const bname=ps.find(x=>x.uid===winUid)?.name,sname=ps.find(x=>x.uid===l.sellerUid)?.name;
     board[l.tile]={...l.building,ownerUid:winUid,owner:bname};
     log=[`🔨 ${bname} ชนะประมูล "${l.building.n}" จาก ${sname} ที่ ${pr}💰`,...log];
   }else{
     const refund=buybackValue(l.building.cost);
     const sname=ps.find(x=>x.uid===l.sellerUid)?.name;
     ps=ps.map(x=>x.uid===l.sellerUid?{...x,resources:{...x.resources,gold:x.resources.gold+refund},score:x.score-(l.building.pts||0)}:x);
     board[l.tile]=null;
     log=[`🏦 "${l.building.n}" ไม่มีผู้เสนอราคา ขายคืนเกมให้ ${sname} อัตโนมัติ ${refund}💰`,...log];
   }
 });
 await updateDoc(roomRef(),{players:ps,board,listings:[],roundPhase:"auction",auction:{buildingIndex:0,bids:{},revealed:false,result:null},log:log.slice(0,10)});
 checkWin(ps,board);
}
async function playResource(cardId){
 const p=me();if(room.roundPhase!=="play"||p.playDone)return;
 const idx=p.cards.findIndex(c=>c.id===cardId);if(idx<0)return;const card=p.cards[idx];
 
 // อนุญาตให้ใช้การ์ดประเภททรัพยากรหรือเพิ่มของได้ทันทีในตาเล่น
 const r={...p.resources};
 if(card.eff) {
   Object.entries(card.eff).forEach(([k,v])=>r[k]=(r[k]||0)+v);
 } else {
   // เผื่อกรณีการ์ดไม่มี eff สำเร็จรูป ให้เพิ่มทรัพยากรพื้นฐานตามไอดีการ์ด
   if(card.cardId==="wood") r.wood=(r.wood||0)+3;
   else if(card.cardId==="brick") r.brick=(r.brick||0)+3;
   else if(card.cardId==="energy") r.energy=(r.energy||0)+2;
   else if(card.cardId==="money"||card.cardId==="gift") r.gold=(r.gold||0)+10;
   else r.gold=(r.gold||0)+5;
 }

 const cards=p.cards.filter(c=>c.id!==cardId);
 await patch({players:room.players.map(x=>x.uid===uid?{...x,resources:r,cards}:x),
 log:logAdd(`🎁 ${p.name} ใช้การ์ด "${card.n}" สำเร็จ`)});
}
async function playObstacle(cardId,targetUid){
 const p=me();if(room.roundPhase!=="play"||p.playDone)return;
 const idx=p.cards.findIndex(c=>c.id===cardId);if(idx<0)return;const card=p.cards[idx];
 if(card.type!=="obstacle"||targetUid===uid)return;
 let ps=room.players.map(x=>({...x,resources:{...x.resources}}));
 const attacker=ps.find(x=>x.uid===uid),target=ps.find(x=>x.uid===targetUid);
 const original=room.players.find(x=>x.uid===targetUid);
 if(card.cardId==="thief"){
   const take=Math.min(6,original.resources.gold);
   target.resources.gold-=take; attacker.resources.gold+=take;
 }
 if(card.cardId==="rat"){
   const take=Math.min(3,original.resources.wood);
   target.resources.wood-=take; attacker.resources.wood+=take;
 }
 if(card.cardId==="storm")target.resources.brick=Math.max(0,target.resources.brick-2);
 if(card.cardId==="blackout")target.resources.energy=Math.max(0,target.resources.energy-2);
 if(card.cardId==="swap"){
   const mine=attacker.resources.gold;attacker.resources.gold=target.resources.gold;target.resources.gold=mine;
 }
 ps=ps.map(x=>x.uid===uid?attacker:x.uid===targetUid?target:x);
 ps=ps.map(x=>x.uid===uid?{...x,cards:x.cards.filter(c=>c.id!==cardId)}:x);
 await patch({players:ps,log:logAdd(`🃏 ${p.name} ใช้ "${card.n}" กับ ${target.name}`)});
 showPopup(`✅ ใช้ "${card.n}" กับ ${target.name} สำเร็จ!`);
}

 const active=(room.listings||[]).filter(l=>!l.closed);
 return `<div class="section-title"><h3>🏷️ ประมูลทรัพย์สินที่สร้างสำเร็จแล้ว</h3><span class="sub">เปิดประมูลให้ผู้เล่นอื่นแข่งราคา — ถ้าไม่มีใครสนใจจะขายคืนเกมให้อัตโนมัติ</span></div>
 ${mine.length?`<div class="inventory">${mine.map(x=>`<div class="building" style="border-color:${colorForUid(uid)}"><h4>${x.t.ic} ${esc(x.t.n)}</h4><small>ราคากลาง 💰${x.t.cost?.gold||0}</small><div class="row" style="margin-top:6px"><button class="btn gold" style="width:100%" onclick="listBuilding(${x.i})">🏷️ เปิดประมูล (เริ่มที่ ${Math.round((x.t.cost?.gold||0)*RESALE_MULT)}💰 • ไม่มีคนสนใจ = คืนเกมอัตโนมัติที่ ${buybackValue(x.t.cost)}💰)</button></div></div>`).join("")}</div>`:`<div class="notice">คุณยังไม่มีทรัพย์สินที่สร้างสำเร็จให้ขาย</div>`}
 ${active.length?`<h4 style="margin:14px 0 7px">📋 รายการเปิดประมูล</h4><div class="trade-list">${active.map(l=>{
   const top=Object.keys(l.bids||{}).length?Math.max(...Object.values(l.bids)):null;
   const isMine=l.sellerUid===uid;
   return `<div class="trade"><b>${l.building.ic} ${esc(l.building.n)}</b> — ผู้ขาย ${esc(playerName(l.sellerUid))} • เปิดที่ ${l.startPrice}💰 • สูงสุดตอนนี้ ${top!==null?top+"💰":"ยังไม่มีผู้เสนอ"}
   ${isMine?`<div class="sub" style="margin-top:6px">รอจนจบรอบนี้ — ถ้าไม่มีผู้เสนอราคาจะขายคืนเกมอัตโนมัติที่ 💰${buybackValue(l.building.cost)}</div>`
   :`<div class="row" style="margin-top:7px"><input type="number" id="bid-${l.id}" placeholder="เสนอราคา"><button class="btn gold" onclick="bidListing('${l.id}',document.getElementById('bid-${l.id}').value)">เสนอราคา</button></div>`}</div>`;
 }).join("")}</div>`:""}
 <div class="center" style="margin-top:14px"><button class="btn green" onclick="finishResale()" ${p.resaleDone?"disabled":""}>${p.resaleDone?"✓ เสร็จแล้ว":"✓ จบช่วงประมูลทรัพย์สินของฉัน"}</button></div>`;
}
function openObstacle(id){
 const c=me().cards.find(x=>x.id===id);if(!c)return;
 const targets=room.players.filter(x=>x.uid!==uid).map(x=>`<button class="btn red" style="width:100%;margin-top:6px" onclick="playObstacle('${id}','${x.uid}')">${AV[room.players.indexOf(x)%AV.length]} ${esc(x.name)}</button>`).join("");
 document.getElementById("modal").innerHTML=`<div class="card" style="max-width:400px;margin:10vh auto"><div class="center"><div style="font-size:45px">${c.ic}</div><h3>${esc(c.n)}</h3><div class="sub">${esc(c.desc)}</div><p style="margin-top:12px">เลือกเป้าหมาย</p>${targets}<button class="btn ghost" style="width:100%;margin-top:8px" onclick="closeModal()">ยกเลิก</button></div></div>`;
 document.getElementById("modal").style.display="block";
}
function closeModal(){document.getElementById("modal").style.display="none"}
function phaseBody(p){
 if(room.roundPhase==="draw")return `<div class="center"><div style="font-size:58px">🃏</div><h3>จั่วการ์ด 5 ใบ</h3><div class="sub" style="margin:7px 0 15px">การ์ดทรัพยากรจะเก็บไว้ใช้/สะสม ส่วนการ์ดขัดขวางจะเก็บไว้เล่นในช่วงสร้าง/เล่น</div>${p.drawDone?`<div class="notice">✓ คุณจั่วครบ 5 ใบแล้ว — รอผู้เล่นคนอื่น (${room.players.filter(x=>x.drawDone).length}/${room.players.length})</div>`:`<button class="btn green" onclick="drawFive()">🃏 จั่ว 5 ใบ</button>`}<div style="margin-top:14px">${handView(p)}</div></div>`;
 if(room.roundPhase==="trade")return tradeView(p);
 if(room.roundPhase==="resale")return resaleView(p);
 if(room.roundPhase==="auction")return auctionView(p);
 if(room.roundPhase==="play")return playView(p);
}
function gameView(){
 const p=me();return `<div class="top"><div class="code">ห้อง ${room.code}</div><div class="phase">รอบ ${room.round} • ${phaseLabel()}</div>
 <div class="row" style="flex:none;gap:6px"><button class="btn ghost" style="padding:8px 12px;font-size:12px" onclick="showWinPopup()">🏆 เงื่อนไขชนะ</button><button class="btn ghost" style="padding:8px 12px;font-size:12px" onclick="showMyPermits()">🎫 การ์ดของฉัน</button><button class="btn ghost" style="padding:8px 12px;font-size:12px" onclick="showMyBuildings()">🏙️ สร้างแล้ว</button><button class="btn ghost" style="padding:8px 12px;font-size:12px" onclick="leave()">ออก</button></div></div>
 ${phaseBar()}${playersBar()}
 <div class="card">${phaseBody(p)}</div>
 <div class="card" style="margin-top:10px">${resources(p)}</div>
 ${room.log?.length?`<div class="card" style="margin-top:10px"><div class="section-title"><h3>📜 บันทึกเหตุการณ์</h3></div><div class="log">${room.log.map(x=>`<div>${esc(x)}</div>`).join("")}</div></div>`:""}`;
}
function endView(){
 const w=room.players.find(x=>x.uid===room.winnerUid);
 return `<div class="lights">${"<i></i>".repeat(9)}</div><div class="card center"><div style="font-size:60px">🏆</div><h2 class="title">${esc(w?.name||"ผู้เล่น")} ชนะเกม!</h2>
 <div class="sub" style="margin-top:8px">สรุปคะแนนสุดท้าย</div>
 <div class="log" style="margin-top:12px;text-align:left">${room.players.slice().sort((a,b)=>b.score-a.score).map(x=>`<div>${esc(x.name)} — ⭐${x.score} 💰${x.resources.gold}</div>`).join("")}</div>
 <button class="btn gold" style="margin-top:16px" onclick="leave()">ออกจากห้อง</button></div>`;
}
function homeView(){
 const n=localStorage.getItem("ctp_name")||"",c=localStorage.getItem("ctp_code")||"";
 return `<div class="lights">${"<i></i>".repeat(9)}</div><div class="card center"><div style="font-size:55px">🏙️</div><div class="title">City Tycoon Party</div><div class="sub">Board Game Edition • สร้างเมือง • ซื้อขาย • ประมูลลับ • ขัดขวาง</div>${err?`<div class="err" style="margin-top:12px">${esc(err)}</div>`:""}
 <div class="row" style="margin-top:20px"><button class="btn gold" onclick="setJoinMode('create')">🚀 สร้างห้อง</button><button class="btn ghost" onclick="setJoinMode('join')">🔑 เข้าร่วมห้อง</button></div>
 ${joinMode==="create"?`<div style="text-align:left;margin-top:16px"><label>ชื่อ</label><input id="nm" value="${esc(n)}" placeholder="ชื่อผู้เล่น"><label>จำนวนผู้เล่น</label><select id="mx" onchange="newMaxP=Number(this.value)">${[2,3,4,5,6].map(x=>`<option ${x===newMaxP?"selected":""}>${x}</option>`).join("")}</select>
 <label>เงื่อนไขชนะ</label><select id="wmSel" onchange="setWinMode(this.value)"><option value="score" ${winMode==="score"?"selected":""}>คะแนนถึงเป้าหมาย</option><option value="collect" ${winMode==="collect"?"selected":""}>สะสมอาคารครบ + เงินถึงเป้า</option></select>
 ${winMode==="score"?`<label>คะแนนเป้าหมาย</label><input id="wt" type="number" value="${winScore}">`:
 `<div class="row"><div><label>บ้าน 🏠</label><input id="wh" type="number" value="${winHouse}"></div><div><label>อาคารกลาง 🏬</label><input id="wmi" type="number" value="${winMid}"></div></div><div class="row"><div><label>ตึกใหญ่ 🏙️</label><input id="wl" type="number" value="${winLarge}"></div><div><label>เงิน 💰</label><input id="wg" type="number" value="${winGold}"></div></div>`}
 <button class="btn green" style="width:100%;margin-top:12px" onclick="newMaxP=Number(document.getElementById('mx').value);confirmCreate(document.getElementById('nm').value)">สร้างเกม</button></div>`:""}
 ${joinMode==="join"?`<div style="text-align:left;margin-top:16px"><label>ชื่อ</label><input id="nm2" value="${esc(n)}" placeholder="ชื่อผู้เล่น"><label>รหัสห้อง</label><input id="cd" value="${esc(c)}" maxlength="4" style="text-transform:uppercase;letter-spacing:4px"><button class="btn gold" style="width:100%;margin-top:12px" onclick="joinRoom(document.getElementById('cd').value,document.getElementById('nm2').value)">เข้าร่วมเกม</button></div>`:""}</div>
 <div class="sub center" style="margin-top:12px">ทุกคนเล่นจากมือถือ/คอมคนละเครื่องได้ ผ่าน Firebase</div>`;
}
function lobbyView(){
 const host=room.hostUid===uid;return `<div class="lights">${"<i></i>".repeat(9)}</div><div class="card"><div class="center"><div class="sub">รหัสห้อง</div><div class="code" style="display:inline-block;font-size:28px;margin-top:6px">${room.code}</div><div class="sub" style="margin-top:6px">แชร์รหัสนี้ให้เพื่อน</div></div>${playersBar()}<div class="center" style="margin-top:12px">${host?`<button class="btn green" onclick="startGame()" ${room.players.length<2?"disabled":""}>🎬 เริ่มเกม ${room.players.length}/${room.maxPlayers}</button>`:`<div class="notice">⏳ รอหัวโต๊ะเริ่มเกม...</div>`}</div></div>`;
}
function render(){
 const app=document.getElementById("app");
 if(!room){winPopupSeen=false;app.innerHTML=homeView();return}
 if(room.gameOver){app.innerHTML=endView();return}
 if(!room.started){app.innerHTML=lobbyView();return}
 app.innerHTML=gameView();
 if(!winPopupSeen){winPopupSeen=true;showWinPopup()}
}
function showWinPopup(){
 const w=room.win||{type:"score",target:100};
 const msg=w.type==="score"?`ทำคะแนนให้ถึง ⭐${w.target} ก่อนผู้เล่นคนอื่นเพื่อชนะ`
 :`ต้องมี 🏠 บ้าน ${w.house} หลัง, 🏬 อาคารกลาง ${w.mid} หลัง, 🏙️ ตึกใหญ่ ${w.large} หลัง และ 💰 เงิน ${w.gold} ขึ้นไป เพื่อชนะ`;
 const m=document.getElementById("modal");
 m.innerHTML=`<div class="card center" style="max-width:360px;margin:25vh auto"><div style="font-size:40px">🏆</div><h3 style="margin-top:6px">เงื่อนไขการชนะ</h3><p class="sub" style="margin-top:8px">${esc(msg)}</p><button class="btn gold" style="margin-top:14px" onclick="closeModal()">เข้าใจแล้ว</button></div>`;
 m.style.display="block";
}
function setWinMode(v){winMode=v;render()}
function confirmCreate(name){
 if(winMode==="score")pendingWin={type:"score",target:Number(document.getElementById("wt").value)||100};
 else pendingWin={type:"collect",house:Number(document.getElementById("wh").value)||1,mid:Number(document.getElementById("wmi").value)||1,large:Number(document.getElementById("wl").value)||1,gold:Number(document.getElementById("wg").value)||0};
 createRoom(name);
}
function selectBuilding(i){selectedBuilding=selectedBuilding===String(i)?null:String(i);render()}
function setJoinMode(mode) {
  joinMode = mode;
  render();
}

/* ===================== GLOBALS ===================== */
Object.assign(window,{createRoom,joinRoom,startGame,leave,setJoinMode,drawFive,bankSell,sendOffer,answerOffer,finishTrade,submitBid,nextAuction,buildSelected,playResource,playObstacle,endTurn,openObstacle,closeModal,selectBuilding,setWinMode,confirmCreate,listBuilding,bidListing,finishResale,showWinPopup,showMyPermits,showMyBuildings});
uid=localStorage.getItem("ctp_uid");if(!uid){uid="guest-"+Math.random().toString(36).slice(2,10);localStorage.setItem("ctp_uid",uid)}
(async()=>{if(!db){err="กรุณาใส่ firebaseConfig ก่อนใช้งาน";render();return}
 const saved=localStorage.getItem("ctp_code");if(saved){try{const d=await getDoc(doc(db,"rooms",saved));if(d.exists()&&d.data().players.some(p=>p.uid===uid)){code=saved;subscribe();return}}catch(e){}}
 render()})();
</script>
<div id="modal" style="display:none;position:fixed;inset:0;background:#000b;z-index:50;padding:12px;overflow:auto"></div>
</body>
</html>
