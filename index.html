<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>City Tycoon Party</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --wood1:#3a2418; --wood2:#5c3a24; --felt:#0f3d2e; --felt2:#155840;
  --gold:#f4c542; --gold2:#e0a422; --card:#fff8ec; --ink:#2a1c10;
  --panel:#241a12ee; --panel2:#2f2216; --line:#6b4a2c; --txt:#f5ead8;
  --muted:#c9b79c; --danger:#e0524a; --ok:#4caf7d;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; font-family:'Kanit',sans-serif; color:var(--txt);
  background:
    radial-gradient(ellipse at top,#4a3016,#1b1006 70%),
    repeating-linear-gradient(45deg,#00000010 0 2px,transparent 2px 6px);
  background-color:#1b1006;
  min-height:100%;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:760px;margin:0 auto;padding:18px 14px 40px}
h1,h2,h3{margin:0;font-weight:800}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);
  border-radius:20px;box-shadow:0 10px 30px #000a,inset 0 1px 0 #ffffff10;padding:20px}
.btn{
  font-family:inherit;border:none;border-radius:14px;padding:14px 20px;font-weight:700;
  font-size:15px;cursor:pointer;transition:.15s transform,.15s box-shadow;box-shadow:0 4px 0 #0005;
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0005}
.btn-gold{background:linear-gradient(180deg,var(--gold),var(--gold2));color:#2a1c10}
.btn-green{background:linear-gradient(180deg,#5fd39a,#2f9d68);color:#062a1c}
.btn-ghost{background:#00000040;color:var(--txt);border:1px solid var(--line)}
.btn-red{background:linear-gradient(180deg,#ef7a72,#c8433a);color:#2a0a08}
.btn:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
input,select{
  font-family:inherit;background:#00000055;border:1px solid var(--line);color:var(--txt);
  border-radius:12px;padding:12px 14px;font-size:15px;width:100%;
}
.center{text-align:center}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row.center-x{justify-content:center}
.logo{font-size:44px}
.title{font-size:26px;background:linear-gradient(180deg,#ffe9a8,var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);font-size:13.5px;margin-top:4px}
.lights{height:10px;display:flex;gap:14px;justify-content:center;margin-bottom:14px}
.lights span{width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px 3px #f4c54290;animation:tw 1.6s infinite alternate}
.lights span:nth-child(odd){animation-delay:.4s}
@keyframes tw{from{opacity:.35}to{opacity:1}}

.seats{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 12px}
.seat{
  min-width:112px;background:#00000055;border:2px solid var(--line);border-radius:16px;
  padding:10px;text-align:center;flex-shrink:0;position:relative;
}
.seat.me{border-color:var(--gold);box-shadow:0 0 0 3px #f4c54230}
.seat.turn{border-color:#5fd39a;box-shadow:0 0 12px #4caf7d80}
.seat .av{font-size:26px}
.seat .nm{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat .sc{font-size:12px;color:var(--gold)}
.seat .badge{position:absolute;top:-8px;right:-6px;background:var(--ok);color:#052;font-size:10px;
  border-radius:8px;padding:1px 6px;font-weight:700}
.seat .badge.wait{background:#00000090;color:var(--muted)}

.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.code-chip{background:#00000060;border:1px dashed var(--gold);border-radius:12px;padding:6px 14px;font-weight:700;letter-spacing:3px}
.phase-chip{background:var(--gold);color:#2a1c10;font-weight:800;font-size:12px;border-radius:20px;padding:5px 14px}

.res{display:flex;gap:12px;justify-content:center;background:#00000050;border-radius:14px;padding:10px;font-size:15px;flex-wrap:wrap}
.res b{color:var(--gold)}

.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:14px 0}
.cell{aspect-ratio:1;background:linear-gradient(180deg,#1e3a2b,var(--felt));border:1px solid #ffffff15;
  border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px}
.cell .ic{font-size:20px}
.cell.empty{color:#ffffff30}

.bcard{background:#00000050;border:1px solid var(--line);border-radius:14px;padding:10px;text-align:left;cursor:pointer}
.bcard:disabled{opacity:.3;cursor:not-allowed}
.bcard .nm{font-weight:700;font-size:13px}
.bcard .cost{font-size:11px;color:var(--muted);margin-top:4px}

.auction-card{background:linear-gradient(180deg,var(--card),#f0e2c2);color:var(--ink);border-radius:18px;
  padding:22px;text-align:center;box-shadow:0 12px 24px #0007,0 0 0 6px #00000020 inset;
  transform:perspective(600px);animation:deal .35s ease}
@keyframes deal{from{transform:translateY(-30px) rotate(-4deg);opacity:0}to{transform:none;opacity:1}}
.auction-card .ic{font-size:46px}
.auction-card .nm{font-size:20px;font-weight:800;margin-top:4px}
.auction-card .desc{font-size:13px;color:#5a4a34;margin:6px 0 12px}
.turnhint{font-size:13px;color:var(--muted);margin-bottom:10px}
.result-banner{font-size:17px;font-weight:800;padding:14px;border-radius:14px;background:#00000050;text-align:center}

.pillrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.hidden{display:none}
.footer-note{font-size:11.5px;color:var(--muted);text-align:center;margin-top:16px}
.err{background:#5a1f1c;border:1px solid var(--danger);color:#ffd6d3;padding:10px 14px;border-radius:12px;font-size:13px}
label.lbl{font-size:12.5px;color:var(--muted);margin-bottom:4px;display:block}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:#00000040;color:var(--txt);font-family:inherit;font-weight:700;cursor:pointer}
.seg button.on{background:var(--gold);color:#2a1c10;border-color:var(--gold)}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="center" style="padding-top:60px">⏳ กำลังเชื่อมต่อ...</div></div>
<script type="module">
// ===================== ตั้งค่า Firebase ของคุณตรงนี้ =====================
// 1) ไปที่ https://console.firebase.google.com -> สร้างโปรเจกต์ใหม่ (ฟรี)
// 2) เมนูซ้าย Build > Firestore Database > Create database -> เลือก "Start in test mode"
// 3) หน้า Project settings (รูปเฟือง) -> เลื่อนลง "Your apps" -> เลือก Web (</>) -> ตั้งชื่อ -> Register app
// 4) คัดลอกค่า firebaseConfig ที่ได้มาใส่แทนของด้านล่างนี้ทั้งหมด
const firebaseConfig = {
  apiKey: "AIzaSyB2xWjr4nxGHQX6MUoxs2q9X8U3JjRnKB8",
  authDomain: "city-tycoon-game-a4928.firebaseapp.com",
  projectId: "city-tycoon-game-a4928",
  storageBucket: "city-tycoon-game-a4928.firebasestorage.app",
  messagingSenderId: "365487358268",
  appId: "1:365487358268:web:03a38434443c5678191e39",
  measurementId: "G-F1PST9HDKC"
};
// ==========================================================================
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, onSnapshot }
  from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

let fdb=null;
if(firebaseConfig.apiKey!=='YOUR_API_KEY'){
  const fapp=initializeApp(firebaseConfig);
  fdb=getFirestore(fapp);
}

const RES={wood:{n:'ไม้',i:'🪵'},brick:{n:'อิฐ',i:'🧱'},energy:{n:'ไฟฟ้า',i:'⚡'},gold:{n:'เงิน',i:'💰'}};
const BUILD={
  house:{n:'บ้านเล็ก',cost:{wood:2,brick:1,energy:0,gold:5},pts:10,ic:'🏠'},
  mall:{n:'ห้างสรรพสินค้า',cost:{wood:4,brick:3,energy:2,gold:20},pts:35,ic:'🏬'},
  powerplant:{n:'โรงไฟฟ้า',cost:{wood:3,brick:5,energy:0,gold:15},pts:30,ic:'⚡'}
};
const CARDS=[
  {n:'ตึกระฟ้าคริสตัล',d:'ให้คะแนนสูงถึง 50 แต้ม',min:15,pts:50,ic:'🏙️'},
  {n:'สวนสนุกกลางเมือง',d:'ให้คะแนน 40 แต้ม',min:12,pts:40,ic:'🎡'},
  {n:'ท่าเรือการค้า',d:'ให้คะแนน 35 แต้ม',min:10,pts:35,ic:'🚢'}
];
const AVATARS=['🧑‍🚀','🧑‍🎤','🧑‍🌾','🧑‍🔧','🧑‍🎨','🧑‍🚒'];
let uid=null;
let room=null, code=null, unsub=null, joinMode=null, newMaxP=4, err='';

function esc(s){return (s||'').replace(/[<>&"]/g,c=>({ '<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]))}
function genCode(){const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<4;i++)s+=c[Math.floor(Math.random()*c.length)];return s}
function myIdx(){return room?room.players.findIndex(p=>p.uid===uid):-1}
function me(){const i=myIdx();return i<0?null:room.players[i]}
function roomRef(c){return doc(fdb,'rooms',c)}

async function createRoom(name){
  err='';
  if(!fdb){err='ยังไม่ได้ตั้งค่า Firebase (ดูคอมเมนต์ด้านบนของโค้ด)';render();return}
  const c=genCode();
  const p={uid,name:name||'ผู้เล่น',resources:{wood:5,brick:5,energy:3,gold:30},grid:Array(25).fill(null),score:0,cardsWon:[],farmed:false,built:false};
  const data={code:c,hostUid:uid,maxPlayers:newMaxP,started:false,round:1,roundPhase:'lobby',
    players:[p],auctionIndex:0,auctionOrder:[],auctionPos:0,bids:{},auctionResult:null};
  await setDoc(roomRef(c),data);
  code=c; localStorage.setItem('ctp_code',c); localStorage.setItem('ctp_name',name||'');
  subscribe();
}

async function joinRoom(c,name){
  err='';
  if(!fdb){err='ยังไม่ได้ตั้งค่า Firebase (ดูคอมเมนต์ด้านบนของโค้ด)';render();return}
  c=(c||'').toUpperCase().trim();
  const d=await getDoc(roomRef(c));
  if(!d.exists()){err='ไม่พบห้องนี้';render();return}
  const data=d.data();
  const exist=data.players.find(p=>p.uid===uid);
  if(!exist){
    if(data.started){err='เกมเริ่มไปแล้ว เข้าร่วมไม่ได้';render();return}
    if(data.players.length>=data.maxPlayers){err='ห้องเต็มแล้ว';render();return}
    data.players.push({uid,name:name||'ผู้เล่น',resources:{wood:5,brick:5,energy:3,gold:30},grid:Array(25).fill(null),score:0,cardsWon:[],farmed:false,built:false});
    await updateDoc(roomRef(c),{players:data.players});
  }
  code=c; localStorage.setItem('ctp_code',c); localStorage.setItem('ctp_name',name||'');
  subscribe();
}

function subscribe(){
  if(unsub)unsub();
  unsub=onSnapshot(roomRef(code),snap=>{
    if(!snap.exists()){room=null;err='ห้องถูกปิดไปแล้ว';code=null;localStorage.removeItem('ctp_code');render();return}
    room=snap.data(); render();
  },e=>{err='เชื่อมต่อขัดข้อง: '+e.message;render()});
}

function leave(){ if(unsub)unsub(); unsub=null; room=null; code=null; localStorage.removeItem('ctp_code'); render(); }
function setJoinMode(m){ joinMode=m; render(); }
function setMaxP(n){ newMaxP=n; render(); }

async function upd(patch){ await updateDoc(roomRef(code),patch); }

async function startGame(){
  if(room.players.length<2)return;
  await upd({started:true,roundPhase:'farm'});
}

async function doFarm(){
  const players=room.players.map(p=>{
    if(p.uid!==uid)return p;
    return {...p,farmed:true,resources:{
      wood:p.resources.wood+Math.floor(Math.random()*3)+1,
      brick:p.resources.brick+Math.floor(Math.random()*3)+1,
      energy:p.resources.energy+Math.floor(Math.random()*2),
      gold:p.resources.gold+10
    }};
  });
  const allDone=players.every(p=>p.farmed);
  const patch={players};
  if(allDone){patch.roundPhase='auction';patch.auctionIndex=0;patch.auctionOrder=players.map(p=>p.uid);patch.auctionPos=0;patch.bids={};patch.auctionResult=null;}
  await upd(patch);
}

async function doBid(amount){
  const bidderUid=room.auctionOrder[room.auctionPos];
  if(bidderUid!==uid)return;
  const bids={...room.bids,[uid]:amount};
  let pos=room.auctionPos+1;
  const patch={bids,auctionPos:pos};
  if(pos>=room.auctionOrder.length){
    let bestUid=null,best=-1;
    Object.entries(bids).forEach(([u,a])=>{if(a>best){best=a;bestUid=u}});
    let players=room.players;
    if(bestUid && best>0){
      const card=CARDS[room.auctionIndex];
      players=players.map(p=>p.uid===bestUid?{...p,resources:{...p.resources,gold:p.resources.gold-best},score:p.score+card.pts,cardsWon:[...p.cardsWon,card.n]}:p);
    }
    patch.players=players;
    patch.auctionResult={winnerUid:(best>0?bestUid:null),amount:best};
  }
  await upd(patch);
}

async function nextAuctionOrBuild(){
  if(room.auctionIndex<CARDS.length-1){
    await upd({auctionIndex:room.auctionIndex+1,auctionPos:0,bids:{},auctionResult:null});
  }else{
    const players=room.players.map(p=>({...p,built:false}));
    await upd({roundPhase:'build',players,auctionResult:null});
  }
}

async function doBuild(key){
  const b=BUILD[key], p=me();
  const idx=p.grid.findIndex(c=>c===null);
  if(idx===-1)return;
  const r=p.resources;
  if(r.wood<b.cost.wood||r.brick<b.cost.brick||r.energy<b.cost.energy||r.gold<b.cost.gold)return;
  const players=room.players.map(pl=>{
    if(pl.uid!==uid)return pl;
    const grid=[...pl.grid]; grid[idx]=key;
    return {...pl,grid,score:pl.score+b.pts,resources:{wood:r.wood-b.cost.wood,brick:r.brick-b.cost.brick,energy:r.energy-b.cost.energy,gold:r.gold-b.cost.gold}};
  });
  await upd({players});
}

async function doReadyBuild(){
  const players=room.players.map(p=>p.uid===uid?{...p,built:true}:p);
  const allDone=players.every(p=>p.built);
  const patch={players};
  if(allDone){patch.roundPhase='farm';patch.round=room.round+1;patch.players=players.map(p=>({...p,farmed:false}));}
  await upd(patch);
}

function render(){
  const app=document.getElementById('app');
  if(!room){ app.innerHTML=homeView(); return; }
  if(!room.started){ app.innerHTML=lobbyView(); return; }
  app.innerHTML=gameView();
}

function homeView(){
  const savedCode=localStorage.getItem('ctp_code')||'';
  const savedName=localStorage.getItem('ctp_name')||'';
  return `
  <div class="lights">${Array(9).fill('<span></span>').join('')}</div>
  <div class="card center">
    <div class="logo">🏙️</div>
    <div class="title">City Tycoon Party</div>
    <div class="sub">ชวนเพื่อนมาแข่งสร้างเมือง ประมูลตึก แข่งคะแนนกันสด ๆ</div>
    ${err?`<div class="err" style="margin-top:14px">${esc(err)}</div>`:''}
    <div class="row center-x" style="margin-top:20px">
      <button class="btn btn-gold" onclick="setJoinMode('create')">🚀 สร้างห้องใหม่</button>
      <button class="btn btn-ghost" onclick="setJoinMode('join')">🔑 เข้าร่วมห้อง</button>
    </div>
    ${joinMode==='create'?`
      <div style="margin-top:22px;text-align:left">
        <label class="lbl">ชื่อของคุณ</label>
        <input id="nmIn" placeholder="เช่น อาร์ม" value="${esc(savedName)}">
        <label class="lbl" style="margin-top:12px">จำนวนผู้เล่นสูงสุด</label>
        <div class="seg">${[2,3,4,5,6].map(n=>`<button class="${n===newMaxP?'on':''}" onclick="setMaxP(${n})">${n}</button>`).join('')}</div>
        <button class="btn btn-green" style="width:100%;margin-top:14px" onclick="createRoom(document.getElementById('nmIn').value)">✅ สร้างห้อง</button>
      </div>`:''}
    ${joinMode==='join'?`
      <div style="margin-top:22px;text-align:left">
        <label class="lbl">ชื่อของคุณ</label>
        <input id="nmIn2" placeholder="เช่น อาร์ม" value="${esc(savedName)}">
        <label class="lbl" style="margin-top:12px">รหัสห้อง</label>
        <input id="cdIn" placeholder="เช่น AB12" style="text-transform:uppercase;letter-spacing:3px" value="${esc(savedCode)}">
        <button class="btn btn-gold" style="width:100%;margin-top:14px" onclick="joinRoom(document.getElementById('cdIn').value,document.getElementById('nmIn2').value)">🔓 เข้าร่วม</button>
      </div>`:''}
  </div>
  <div class="footer-note">เล่นได้พร้อมกันหลายเครื่อง — แชร์รหัสห้องให้เพื่อนแล้วมานั่งวงเดียวกันแบบออนไลน์ 🎉</div>`;
}

function lobbyView(){
  const isHost=room.hostUid===uid;
  return `
  <div class="lights">${Array(9).fill('<span></span>').join('')}</div>
  <div class="card">
    <div class="center">
      <div class="sub">รหัสห้อง — บอกเพื่อนให้พิมพ์รหัสนี้</div>
      <div class="code-chip" style="font-size:26px;margin-top:6px">${room.code}</div>
    </div>
    <div class="seats" style="margin-top:20px">
      ${room.players.map((p,i)=>`
        <div class="seat ${p.uid===uid?'me':''}">
          <div class="av">${AVATARS[i%AVATARS.length]}</div>
          <div class="nm">${esc(p.name)}</div>
          <div class="sc">${p.uid===room.hostUid?'👑 หัวโต๊ะ':'ผู้เล่น'}</div>
        </div>`).join('')}
      ${Array(room.maxPlayers-room.players.length).fill(0).map(()=>`
        <div class="seat" style="opacity:.4"><div class="av">⏳</div><div class="nm">รอเข้าร่วม</div></div>`).join('')}
    </div>
    <div class="center" style="margin-top:16px">
      ${isHost?`<button class="btn btn-green" ${room.players.length<2?'disabled':''} onclick="startGame()">🎬 เริ่มเกม (${room.players.length}/${room.maxPlayers} คน)</button>`
        :`<div class="sub">⏳ รอหัวโต๊ะกดเริ่มเกม...</div>`}
      <div style="margin-top:14px"><button class="btn btn-ghost" onclick="leave()">🚪 ออกจากห้อง</button></div>
    </div>
  </div>`;
}

function seatsBar(){
  const phase=room.roundPhase;
  return `<div class="seats">${room.players.map((p,i)=>{
    let badge='';
    if(phase==='farm')badge=p.farmed?'<div class="badge">พร้อม</div>':'<div class="badge wait">กำลังฟาร์ม</div>';
    if(phase==='auction'){
      const bidderUid=room.auctionOrder[room.auctionPos];
      if(room.bids[p.uid]!==undefined)badge=`<div class="badge">💰${room.bids[p.uid]}</div>`;
      else if(bidderUid===p.uid)badge='<div class="badge" style="background:var(--gold);color:#2a1c10">กำลังสู้ราคา</div>';
    }
    if(phase==='build')badge=p.built?'<div class="badge">พร้อม</div>':'<div class="badge wait">กำลังสร้าง</div>';
    return `<div class="seat ${p.uid===uid?'me':''}">${badge}
      <div class="av">${AVATARS[i%AVATARS.length]}</div>
      <div class="nm">${esc(p.name)}</div>
      <div class="sc">⭐ ${p.score}</div>
    </div>`;
  }).join('')}</div>`;
}

function gameView(){
  const p=me();
  if(!p)return `<div class="card center">คุณไม่ได้อยู่ในห้องนี้แล้ว</div>`;
  const phaseLabel={farm:'🌾 ช่วงฟาร์ม',auction:'🔨 ช่วงประมูล',build:'🏗️ ช่วงก่อสร้าง'}[room.roundPhase];
  return `
  <div class="topbar">
    <div class="code-chip">${room.code}</div>
    <div class="phase-chip">รอบที่ ${room.round} • ${phaseLabel}</div>
    <button class="btn btn-ghost" style="padding:8px 14px;font-size:12px" onclick="leave()">ออก</button>
  </div>
  ${seatsBar()}
  <div class="res">
    <span>🪵 <b>${p.resources.wood}</b></span>
    <span>🧱 <b>${p.resources.brick}</b></span>
    <span>⚡ <b>${p.resources.energy}</b></span>
    <span>💰 <b>${p.resources.gold}</b></span>
    <span>⭐ <b>${p.score}</b> แต้ม</span>
  </div>
  <div class="card" style="margin-top:14px">${phaseBody(p)}</div>`;
}

function phaseBody(p){
  if(room.roundPhase==='farm'){
    if(p.farmed){
      const doneCount=room.players.filter(x=>x.farmed).length;
      return `<div class="center"><div style="font-size:44px">✅</div><h3>ฟาร์มเรียบร้อย!</h3>
        <div class="sub" style="margin-top:6px">รอเพื่อนอีก ${room.players.length-doneCount} คน... (${doneCount}/${room.players.length})</div></div>`;
    }
    return `<div class="center"><div style="font-size:56px">🌾</div><h3>ช่วงเวลาฟาร์มทรัพยากร</h3>
      <div class="sub" style="margin:8px 0 18px">กดปุ่มเพื่อสุ่มรับไม้ อิฐ ไฟฟ้า และเงินทุน</div>
      <button class="btn btn-green" onclick="doFarm()">🪓 ฟาร์มวัตถุดิบ</button></div>`;
  }
  if(room.roundPhase==='auction'){
    const card=CARDS[room.auctionIndex];
    const bidderUid=room.auctionOrder[room.auctionPos];
    const myTurn=bidderUid===uid;
    if(room.auctionResult){
      const w=room.players.find(x=>x.uid===room.auctionResult.winnerUid);
      return `<div class="result-banner">${w?`🏆 ${esc(w.name)} ชนะประมูล ด้วยราคา ${room.auctionResult.amount} 💰`:'❌ ไม่มีใครสู้ราคาในรอบนี้'}</div>
        <div class="center" style="margin-top:16px">
          ${room.hostUid===uid?`<button class="btn btn-gold" onclick="nextAuctionOrBuild()">${room.auctionIndex<CARDS.length-1?'การ์ดใบถัดไป ➡️':'เข้าสู่ช่วงก่อสร้าง 🏗️'}</button>`:`<div class="sub">รอหัวโต๊ะไปต่อ...</div>`}
        </div>`;
    }
    return `<div class="auction-card">
        <div class="ic">${card.ic}</div><div class="nm">${card.n}</div>
        <div class="desc">${card.d} • ราคาเริ่มต้น ${card.min} 💰</div>
      </div>
      <div class="turnhint center" style="margin-top:12px">การ์ดใบที่ ${room.auctionIndex+1}/${CARDS.length} — ${myTurn?'ตาคุณสู้ราคา!':`รอ ${esc(room.players.find(x=>x.uid===bidderUid)?.name||'')} ตัดสินใจ...`}</div>
      <div class="pillrow">
        ${[5,10,15,20].map(b=>`<button class="btn btn-gold" ${(!myTurn||p.resources.gold<b||b<card.min)?'disabled':''} onclick="doBid(${b})">สู้ ${b} 💰</button>`).join('')}
        <button class="btn btn-red" ${!myTurn?'disabled':''} onclick="doBid(0)">ขอผ่าน</button>
      </div>`;
  }
  if(room.roundPhase==='build'){
    if(p.built){
      const doneCount=room.players.filter(x=>x.built).length;
      return `<div class="center"><div style="font-size:44px">✅</div><h3>สร้างเสร็จแล้ว!</h3>
        <div class="sub" style="margin-top:6px">รอเพื่อนอีก ${room.players.length-doneCount} คน... (${doneCount}/${room.players.length})</div></div>`;
    }
    return `
    <h3 class="sub" style="color:var(--txt)">🏗️ กระดานเมืองของคุณ</h3>
    <div class="grid5">${p.grid.map(c=>c?`<div class="cell"><div class="ic">${BUILD[c].ic}</div>${BUILD[c].n}</div>`:`<div class="cell empty">ว่าง</div>`).join('')}</div>
    <div class="row" style="gap:8px">
      ${Object.entries(BUILD).map(([k,b])=>{
        const ok=p.resources.wood>=b.cost.wood&&p.resources.brick>=b.cost.brick&&p.resources.energy>=b.cost.energy&&p.resources.gold>=b.cost.gold&&p.grid.includes(null);
        return `<button class="bcard" style="flex:1;min-width:140px" ${ok?'':'disabled'} onclick="doBuild('${k}')">
          <div class="nm">${b.ic} ${b.n}</div>
          <div class="cost">🪵${b.cost.wood} 🧱${b.cost.brick} ⚡${b.cost.energy} 💰${b.cost.gold} → ⭐${b.pts}</div>
        </button>`;
      }).join('')}
    </div>
    <div class="center" style="margin-top:16px"><button class="btn btn-green" onclick="doReadyBuild()">✅ จบตาก่อสร้างของฉัน</button></div>`;
  }
  return '';
}

Object.assign(window,{createRoom,joinRoom,startGame,doFarm,doBid,nextAuctionOrBuild,doBuild,doReadyBuild,leave,setJoinMode,setMaxP});

(async function init(){
  uid=localStorage.getItem('ctp_uid');
  if(!uid){ uid='guest-'+Math.random().toString(36).slice(2,10); localStorage.setItem('ctp_uid',uid); }
  if(!fdb){ err='ยังไม่ได้ตั้งค่า Firebase — เปิดไฟล์นี้ด้วยโปรแกรมแก้ไขข้อความแล้วกรอก firebaseConfig ตามคอมเมนต์ด้านบนของโค้ด'; render(); return; }
  const savedCode=localStorage.getItem('ctp_code');
  if(savedCode){
    try{
      const d=await getDoc(roomRef(savedCode));
      if(d.exists() && d.data().players.some(p=>p.uid===uid)){ code=savedCode; subscribe(); return; }
    }catch(e){}
    localStorage.removeItem('ctp_code');
  }
  render();
})();
</script>
</body>
</html>
