<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>City Tycoon Party — Board Game Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --wood:#2b180e;--wood2:#51301d;--felt:#0d3b2e;--felt2:#145642;
  --gold:#f5c84b;--gold2:#d99d22;--cream:#fff6df;--ink:#24170d;
  --panel:#20150fee;--panel2:#302015;--line:#755031;--txt:#f7ead5;
  --muted:#cbb89b;--ok:#4fc58a;--bad:#e45b52;--blue:#62b8e8;
}
*{box-sizing:border-box}html,body{min-height:100%;margin:0}
body{font-family:Kanit,sans-serif;color:var(--txt);background:
radial-gradient(circle at 50% -10%,#70461f 0,#2b180e 35%,#120a05 100%);
-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit}
button{cursor:pointer}.wrap{max-width:980px;margin:auto;padding:16px 12px 42px}
h1,h2,h3,p{margin:0}.center{text-align:center}.hidden{display:none}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);
border-radius:20px;padding:18px;box-shadow:0 12px 35px #0008,inset 0 1px #fff1}
.btn{border:0;border-radius:13px;padding:11px 16px;font-weight:800;font-size:14px;
box-shadow:0 4px 0 #0005;transition:.12s}.btn:active{transform:translateY(3px);box-shadow:0 1px #0005}
.btn:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}.gold{background:linear-gradient(#ffe07a,#d99d22);color:#2a1b08}
.green{background:linear-gradient(#6be0a4,#329667);color:#06281b}.red{background:linear-gradient(#ef7b72,#c7473d);color:#300a08}
.ghost{background:#0005;color:var(--txt);border:1px solid var(--line)}
input,select{width:100%;background:#0006;color:var(--txt);border:1px solid var(--line);border-radius:11px;padding:11px 12px;font-size:14px}
label{display:block;color:var(--muted);font-size:12px;margin:10px 0 4px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:110px}
.title{font-size:30px;font-weight:800;color:var(--gold)}.sub{color:var(--muted);font-size:13px}
.lights{display:flex;justify-content:center;gap:14px;margin:5px 0 14px}.lights i{width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px #f5c84b;display:block}
.top{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.phase{background:var(--gold);color:var(--ink);border-radius:20px;padding:5px 13px;font-size:12px;font-weight:800}
.code{border:1px dashed var(--gold);background:#0006;border-radius:11px;padding:5px 12px;letter-spacing:3px;font-weight:800}
.players{display:flex;gap:9px;overflow-x:auto;padding:5px 2px 12px}
.player{min-width:118px;position:relative;text-align:center;background:#0005;border:1px solid var(--line);border-radius:15px;padding:9px}
.player.me{box-shadow:0 0 0 2px #f5c84b30}.player.turn{box-shadow:0 0 13px #4fc58a70}
.av{font-size:25px}.pname{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mini{font-size:11px;color:var(--gold)}
.badge{font-size:10px;border-radius:8px;padding:2px 6px;background:var(--ok);color:#06281b;position:absolute;right:4px;top:4px;font-weight:800}
.badge.wait{background:#000b;color:var(--muted)}
.resources{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:10px 0}
.resbox{background:#0005;border:1px solid #fff1;border-radius:12px;padding:8px;text-align:center}.resbox b{display:block;font-size:16px;color:var(--gold)}
.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.section-title h3{font-size:17px}
.phasebar{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:10px 0 14px}.step{padding:7px 4px;text-align:center;border-radius:9px;background:#0004;border:1px solid #fff1;font-size:11px;color:var(--muted)}
.step.on{background:#f5c84b;color:var(--ink);font-weight:800;border-color:var(--gold)}
.hand{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.playing-card{min-height:145px;background:linear-gradient(145deg,#fff9e9,#e6d4af);color:var(--ink);
border-radius:14px;padding:10px;position:relative;box-shadow:0 7px 14px #0006;border:3px solid #fff;cursor:pointer}
.playing-card .icon{font-size:32px}.playing-card .cn{font-weight:800;font-size:13px}.playing-card .cd{font-size:10px;color:#66533b;margin-top:4px}
.playing-card.obstacle{background:linear-gradient(145deg,#ffe1dc,#e9b0aa)}.playing-card.buildingcard{background:linear-gradient(145deg,#dff3ff,#b9dcf2)}.playing-card.selected{outline:3px solid var(--gold);transform:translateY(-4px)}
.tile.buildable{cursor:pointer;box-shadow:0 0 0 2px var(--gold) inset}.tile.buildable:active{transform:scale(.95)}
.tag{position:absolute;right:6px;top:6px;font-size:9px;padding:2px 5px;border-radius:6px;background:#0002;font-weight:800}
.auction-card{max-width:380px;min-height:260px;margin:18px auto;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 35%,#fffef5 0,#f6e9c9 58%,#dfc99d 100%);color:#30200e;border:8px solid #f7e9c9;border-radius:18px;padding:20px 18px;text-align:center;box-shadow:0 18px 28px #0009, inset 0 0 0 2px #a77b36, inset 0 0 0 5px #fff8; transform:rotate(-1deg)}
.auction-card:before{content:"CITY TYCOON • PROPERTY EDITION";display:block;border-top:1px solid #a77b36;border-bottom:1px solid #a77b36;padding:5px 0;font-size:10px;font-weight:800;letter-spacing:2px;color:#886027}
.auction-card:after{content:"✦";position:absolute;right:13px;bottom:4px;font-size:28px;color:#b38a45;opacity:.55}
.auction-card .icon{font-size:66px;margin:12px 0 4px;filter:drop-shadow(0 4px 2px #0002)}.auction-card h2{font-size:25px;font-weight:800}.auction-card .cost{font-size:12px;color:#65513a;margin-top:7px}.auction-card .card-ribbon{display:inline-block;background:#315b46;color:#fff4d4;border-radius:20px;padding:4px 15px;font-size:11px;font-weight:800;letter-spacing:1px;margin:7px 0}
.bidbox{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:12px}.bidbox input{font-size:18px;text-align:center}
.hidden-status{font-size:12px;color:var(--muted);text-align:center;margin-top:8px}
.reveal{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:7px;margin-top:12px}
.bidresult{border:1px solid var(--line);background:#0005;border-radius:12px;padding:9px;text-align:center}.bidresult.win{border-color:var(--gold);background:#6a4a1420}
.board{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}.tile{aspect-ratio:1;background:linear-gradient(#214c3c,#0e3227);border:1px solid #fff2;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.tile .icon{font-size:15px}.tile small{font-size:6px;color:#ddd}
.inventory{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px}.building{background:#0005;border:1px solid var(--line);border-radius:13px;padding:10px}
.building.selected{border-color:var(--gold);box-shadow:0 0 0 2px #f5c84b30}.building h4{margin:0;font-size:13px}.building small{color:var(--muted)}
.trade-list{display:grid;gap:8px}.trade{background:#0005;border:1px solid var(--line);border-radius:12px;padding:10px}
.log{font-size:12px;color:#dbcbb4;display:grid;gap:3px}.notice{padding:10px;border-radius:11px;background:#0005;border:1px solid #fff1;font-size:13px}
.err{background:#5a201c;border:1px solid var(--bad);padding:10px;border-radius:11px;color:#ffd8d4;font-size:13px}
@media(max-width:650px){.hand{grid-template-columns:repeat(2,1fr)}.resources{grid-template-columns:repeat(3,1fr)}.board{grid-template-columns:repeat(6,1fr)}.playing-card{min-height:125px}.wrap{padding:10px 9px 35px}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="card center">⏳ กำลังเชื่อมต่อ...</div></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {getFirestore,doc,getDoc,setDoc,updateDoc,onSnapshot,runTransaction}
from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

/* ===================== FIREBASE ===================== */
const firebaseConfig={
  apiKey: "AIzaSyB2xwjr4nxGHQX6MUoxs2q9X8U3jjRnKB8",
  authDomain: "city-tycoon-game-a4928.firebaseapp.com",
  projectId: "city-tycoon-game-a4928",
  storageBucket: "city-tycoon-game-a4928.appspot.com",
  messagingSenderId: "365487358268",
  appId: "1:365487358268:web:03a38434443c5678191e39"
};
let db=null;
if(firebaseConfig.apiKey!=="YOUR_API_KEY") db=getFirestore(initializeApp(firebaseConfig));

/* ===================== GAME DATA ===================== */
const RES={
 wood:{n:"ไม้",i:"🪵",sell:300},brick:{n:"อิฐ",i:"🧱",sell:350},
 energy:{n:"ไฟฟ้า",i:"⚡",sell:400},gold:{n:"เงิน",i:"💰"}
};
const PLOT_TYPES=[
 {name:"ป่าไม้",ic:"🌲",price:3000,prod:{wood:1}},
 {name:"เหมืองอิฐ",ic:"⛏️",price:3500,prod:{brick:1}},
 {name:"โรงไฟฟ้า",ic:"⚡",price:4000,prod:{energy:1}},
 {name:"ย่านการค้า",ic:"🏪",price:5000,prod:{gold:1000}},
 {name:"ย่านที่อยู่อาศัย",ic:"🏘️",price:5500,prod:{wood:1,gold:500}},
 {name:"พื้นที่โล่ง",ic:"🟫",price:2500,prod:{}}
];
const BUILDINGS=[
 {n:"บ้านพักอาศัย",ic:"🏠",basePrice:4000,prod:{wood:1,gold:500},pts:15,tier:0},
 {n:"ร้านค้า",ic:"🏪",basePrice:6000,prod:{energy:1,gold:600},pts:20,tier:0},
 {n:"โรงงานขนาดเล็ก",ic:"🏭",basePrice:8000,prod:{brick:2,wood:1,gold:1200},pts:30,tier:1},
 {n:"สำนักงาน",ic:"🏢",basePrice:10000,prod:{energy:2,gold:1500},pts:35,tier:1},
 {n:"โรงไฟฟ้า",ic:"🏗️",basePrice:12000,prod:{energy:2,gold:2300},pts:45,tier:2},
 {n:"ห้างสรรพสินค้า",ic:"🏬",basePrice:16000,prod:{brick:2,wood:2,gold:2900},pts:55,tier:2}
];
const DECK=[
 {id:"wood",ic:"🪵",n:"ไม้",type:"resource",desc:"รับไม้ +2",eff:{wood:2},w:4},
 {id:"brick",ic:"🧱",n:"อิฐ",type:"resource",desc:"รับอิฐ +2",eff:{brick:2},w:4},
 {id:"energy",ic:"⚡",n:"ไฟฟ้า",type:"resource",desc:"รับไฟฟ้า +2",eff:{energy:2},w:3},
 {id:"money",ic:"💰",n:"เงิน",type:"resource",desc:"รับเงิน +3,000",eff:{gold:3000},w:3},
 {id:"tax",ic:"🧾",n:"ภาษีเพิ่มขึ้น",type:"obstacle",desc:"ผู้เล่นที่เลือกจ่ายภาษี -2,000💰"},
 {id:"blackout",ic:"🔌",n:"ปิดไฟฟ้า",type:"obstacle",desc:"ผู้เล่นที่เลือกเสียไฟฟ้า 1 หน่วย"},
 {id:"protest",ic:"📢",n:"ก่อการประท้วง",type:"obstacle",desc:"ผู้เล่นที่เลือกข้ามรับผลผลิตตอนจบรอบนี้"},
 {id:"thief",ic:"🥷",n:"ขโมยทรัพยากร",type:"obstacle",desc:"เลือกผู้เล่น 1 คน ขโมยทรัพยากร 2 หน่วย"}
];
const AV=["🧑‍🚀","🧑‍🎤","🧑‍🌾","🧑‍🔧","🧑‍🎨","🧑‍🚒"];
const BOARD_N=24;
const PLOTS=Array.from({length:BOARD_N},(_,i)=>PLOT_TYPES[i%PLOT_TYPES.length]);
const ACTIONS_PER_TURN=3,DRAW_ACTIONS=5;
let uid=null,room=null,code=null,unsub=null,joinMode=null,newMaxP=4,err="",selectedBuilding=null;
let winMode="score",winScore=100,winHouse=2,winMid=1,winLarge=1,winGold=5000,pendingWin=null,winPopupSeen=false;
const RESALE_MULT=1.5;

/* ===================== HELPERS ===================== */
const esc=s=>(s??"").toString().replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
const roomRef=()=>doc(db,"rooms",code);
const me=()=>room?.players?.find(p=>p.uid===uid);
const weightedCard=()=>{let a=[];DECK.forEach(c=>{for(let i=0;i<(c.w||1);i++)a.push(c)});return a[Math.floor(Math.random()*a.length)]};
function prodText(prod){return Object.entries(prod||{}).filter(([k,v])=>v).map(([k,v])=>k==='gold'?`💰+${v}`:`${RES[k].i}+${v}`).join(' ')||'ไม่มี'}
function playerName(u){return room.players.find(p=>p.uid===u)?.name||"ผู้เล่น"}
async function patch(x){await updateDoc(roomRef(),x)}
async function withFreshRoom(fn){const snap=await getDoc(roomRef());if(!snap.exists())return;return fn(snap.data())}
function phaseLabel(){return {draw:"🃏 จั่วการ์ด",trade:"🤝 ซื้อขายทรัพยากร",resale:"🏷️ ประมูลทรัพย์สิน",auction:"🔨 ประมูลอาคาร",play:"🏗️ ซื้อที่ดิน/สร้าง/เล่นการ์ด"}[room.roundPhase]||""}

/* ===================== TURN ORDER / ACTION ENGINE ===================== */
function turnOrderFor(round,players){
 const n=players.length;if(!n)return[];
 const start=(round-1)%n;
 return Array.from({length:n},(_,i)=>players[(start+i)%n].uid);
}
function buybackValue(basePrice){return Math.round((basePrice||0)*0.75)}
function distributeProduction(r){
 let players=r.players.map(p=>({...p,resources:{...p.resources}}));
 const totals={};
 (r.board||[]).forEach((t,i)=>{
   if(!t||!t.ownerUid)return;
   const plot=PLOTS[i];
   const prod={wood:0,brick:0,energy:0,gold:0};
   Object.entries(plot.prod||{}).forEach(([k,v])=>prod[k]+=v);
   if(t.building?.prod)Object.entries(t.building.prod).forEach(([k,v])=>prod[k]+=v);
   totals[t.ownerUid]=totals[t.ownerUid]||{wood:0,brick:0,energy:0,gold:0};
   Object.keys(prod).forEach(k=>totals[t.ownerUid][k]+=prod[k]);
 });
 let anyGain=false,anySkipped=false;
 players=players.map(p=>{
   if(p.skipProduction){anySkipped=true;return{...p,skipProduction:false}}
   const t=totals[p.uid];if(!t)return p;
   if(t.wood||t.brick||t.energy||t.gold)anyGain=true;
   return {...p,resources:{wood:p.resources.wood+t.wood,brick:p.resources.brick+t.brick,energy:p.resources.energy+t.energy,gold:p.resources.gold+t.gold}};
 });
 const log=[];
 if(anyGain)log.push("🏭 ทุกคนได้รับผลผลิตจากที่ดิน/สิ่งปลูกสร้างท้ายรอบแล้ว");
 if(anySkipped)log.push("📢 มีผู้เล่นถูกประท้วง ข้ามรับผลผลิตรอบนี้");
 return {players,log};
}
function resolveResaleTransition(r){
 let board=[...r.board],ps=[...r.players],log=[...(r.log||[])];
 (r.listings||[]).filter(l=>!l.closed).forEach(l=>{
   const bids=Object.entries(l.bids||{});
   const t=board[l.tile];if(!t)return;
   if(bids.length){
     const [winUid,price]=bids.sort((a,b)=>b[1]-a[1])[0],pr=Number(price);
     ps=ps.map(x=>{
       if(x.uid===l.sellerUid)return{...x,resources:{...x.resources,gold:x.resources.gold+pr}};
       if(x.uid===winUid)return{...x,resources:{...x.resources,gold:x.resources.gold-pr}};
       return x;
     });
     const bname=ps.find(x=>x.uid===winUid)?.name,sname=ps.find(x=>x.uid===l.sellerUid)?.name;
     board[l.tile]={...t,ownerUid:winUid,ownerName:bname};
     log=[`🔨 ${bname} ชนะประมูล "${t.building?.n||'ที่ดิน'}" จาก ${sname} ที่ ${pr}💰`,...log];
   }else{
     const refund=buybackValue(l.basePrice||0);
     const sname=ps.find(x=>x.uid===l.sellerUid)?.name;
     ps=ps.map(x=>x.uid===l.sellerUid?{...x,resources:{...x.resources,gold:x.resources.gold+refund}}:x);
     board[l.tile]=null;
     log=[`🏦 "${t.building?.n||'ที่ดิน'}" ไม่มีผู้เสนอราคา ขายคืนเกมให้ ${sname} อัตโนมัติ ${refund}💰`,...log];
   }
 });
 checkWinFromArrays(r,ps,board);
 return {roundPhase:"auction",players:ps,board,listings:[],auction:{buildingDeck:r.auction?.buildingDeck||[],buildingIndex:0,bids:{},revealed:false,result:null},log:log.slice(0,10)};
}
function phaseTransition(r){
 if(r.roundPhase==="draw")return{roundPhase:"trade",queue:turnOrderFor(r.round,r.players),actionsLeft:ACTIONS_PER_TURN};
 if(r.roundPhase==="trade")return{roundPhase:"resale",queue:turnOrderFor(r.round,r.players),actionsLeft:ACTIONS_PER_TURN};
 if(r.roundPhase==="resale")return resolveResaleTransition(r);
 if(r.roundPhase==="play"){
   const {players,log:prodLog}=distributeProduction(r);
   const nextRound=r.round+1;
   return{roundPhase:"draw",round:nextRound,queue:turnOrderFor(nextRound,players),actionsLeft:DRAW_ACTIONS,players,log:[...prodLog,...(r.log||[])].slice(0,10)};
 }
 return{};
}
function advanceAfterAction(r,forceEndTurn){
 let queue=[...(r.queue||[])];
 const capLeft=r.roundPhase==="draw"?DRAW_ACTIONS:ACTIONS_PER_TURN;
 let left=(r.actionsLeft??capLeft)-1;
 const out={};
 if(forceEndTurn||left<=0){
   queue.shift();
   if(queue.length){out.queue=queue;out.actionsLeft=capLeft}
   else Object.assign(out,phaseTransition(r));
 }else{out.queue=queue;out.actionsLeft=left}
 return out;
}
function checkWinFromArrays(r,players,board){
 const win=r.win||{type:"score",target:100};let winner=null;
 for(const pl of players){
   if(win.type==="score"){if(pl.score>=win.target){winner=pl.uid;break}}
   else{
     const cnt={0:0,1:0,2:0};
     board.forEach(t=>{if(t&&t.ownerUid===pl.uid&&t.building){const tier=BUILDINGS[t.building.buildingIndex]?.tier??0;cnt[tier]=(cnt[tier]||0)+1}});
     if(cnt[0]>=win.house&&cnt[1]>=win.mid&&cnt[2]>=win.large&&pl.resources.gold>=win.gold){winner=pl.uid;break}
   }
 }
 if(winner)updateDoc(roomRef(),{gameOver:true,winnerUid:winner});
}

/* ===================== ROOM ===================== */
function genCode(){const c="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";return Array.from({length:4},()=>c[Math.floor(Math.random()*c.length)]).join("")}
function blankPlayer(name){
 return {uid,name:name||"ผู้เล่น",resources:{wood:5,brick:5,energy:3,gold:15000},score:0,cards:[],skipProduction:false};
}
async function createRoom(name){
 err="";if(!db){err="ยังไม่ได้ตั้งค่า Firebase";render();return}
 const c=genCode(),p=blankPlayer(name);
 const data={code:c,hostUid:uid,maxPlayers:newMaxP,started:false,round:1,roundPhase:"draw",
 players:[p],board:Array(BOARD_N).fill(null),log:[],auction:{buildingDeck:[],buildingIndex:0,bids:{},revealed:false,result:null},
 offers:[],listings:[],queue:[],actionsLeft:0,gameOver:false,winnerUid:null,
 win:pendingWin||{type:"score",target:100}};
 await setDoc(doc(db,"rooms",c),data);code=c;localStorage.setItem("ctp_code",c);localStorage.setItem("ctp_name",name||"");subscribe();
}
async function joinRoom(c,name){
 err="";if(!db){err="ยังไม่ได้ตั้งค่า Firebase";render();return}
 c=(c||"").toUpperCase().trim();let d=await getDoc(doc(db,"rooms",c));
 if(!d.exists()){err="ไม่พบห้องนี้";render();return}
 let data=d.data();if(!data.players.some(p=>p.uid===uid)){
   if(data.started){err="เกมเริ่มแล้ว เข้าร่วมไม่ได้";render();return}
   if(data.players.length>=data.maxPlayers){err="ห้องเต็มแล้ว";render();return}
   data.players.push(blankPlayer(name));await updateDoc(doc(db,"rooms",c),{players:data.players});
 }
 code=c;localStorage.setItem("ctp_code",c);localStorage.setItem("ctp_name",name||"");subscribe();
}
function subscribe(){
 if(unsub)unsub();unsub=onSnapshot(roomRef(),s=>{if(!s.exists()){leave();return}room=s.data();render()},e=>{err="เชื่อมต่อขัดข้อง: "+e.message;render()});
}
function leave(){if(unsub)unsub();unsub=null;room=null;code=null;winPopupSeen=false;localStorage.removeItem("ctp_code");render()}
async function startGame(){
 if(room.players.length<2)return;
 const players=room.players.map(p=>({...p,resources:{wood:5,brick:5,energy:3,gold:15000},cards:[],score:0,skipProduction:false}));
 const buildingDeck=BUILDINGS.map((_,i)=>i).sort(()=>Math.random()-.5).slice(0,3);

async function submitBid(amount){
 amount=Number(amount);const p=me();const a=room.auction||{};
 if(room.roundPhase!=="auction"||a.revealed||a.bids[uid]!==undefined||amount<0||amount>p.resources.gold)return;
 const fresh=await getDoc(roomRef());if(!fresh.exists())return;const r=fresh.data(),au=r.auction||{};
 const bids={...(au.bids||{}),[uid]:amount};
 const players=r.players;
 if(Object.keys(bids).length===players.length){
   const b=BUILDINGS[(au.buildingDeck||[])[au.buildingIndex]??au.buildingIndex];
   const positive=Object.entries(bids).filter(([u,v])=>Number(v)>=b.basePrice).sort((x,y)=>Number(y[1])-Number(x[1]));
   const winner=positive[0]?.[0]||null,price=winner?Number(positive[0][1]):0;
   const tied=positive.filter(x=>Number(x[1])===price);
   const win=tied.length? tied[0][0]:winner;
   let ps=players;
   if(win&&price>0){
     const permit={id:"bd"+Date.now()+Math.random().toString(36).slice(2,7),type:"building",buildingIndex:au.buildingIndex,ic:b.ic,n:b.n,prod:b.prod,pts:b.pts};
     ps=players.map(x=>x.uid===win?{...x,resources:{...x.resources,gold:x.resources.gold-price},cards:[...(x.cards||[]),permit]}:x);
   }
   await updateDoc(roomRef(),{players:ps,auction:{...au,bids,revealed:true,result:{winnerUid:win,price}},log:[win?`🔨 ${playerName(win)} ชนะ "${b.n}" ด้วย ${price}💰`:`🔨 ไม่มีผู้ชนะ "${b.n}" (ไม่มีใครเสนอถึงราคาเริ่มต้น)`,...(r.log||[])].slice(0,10)});
 }else await updateDoc(roomRef(),{auction:{...au,bids}});
}

async function playResource(cardId){
 if(!room||room.roundPhase!=="play"||room.queue?.[0]!==uid)return;
 await withFreshRoom(async r=>{
   if(r.roundPhase!=="play"||r.queue?.[0]!==uid)return;

   const rr={...p.resources};

   const cards=p.cards.filter(c=>c.id!==cardId);
   const players=r.players.map(x=>x.uid===uid?{...x,resources:rr,cards}:x);
   const log=[`🎁 ${p.name} ใช้การ์ด "${card.n}" สำเร็จ`,...(r.log||[])].slice(0,10);
   const newR={...r,players,log};

 });

async function playObstacle(cardId,targetUid){
 if(!room||room.roundPhase!=="play"||room.queue?.[0]!==uid)return;
 await withFreshRoom(async r=>{
   if(r.roundPhase!=="play"||r.queue?.[0]!==uid)return;
   const p=r.players.find(x=>x.uid===uid);
   const idx=(p.cards||[]).findIndex(c=>c.id===cardId);if(idx<0)return;const card=p.cards[idx];
   if(card.type!=="obstacle"||targetUid===uid)return;
   let ps=r.players.map(x=>({...x,resources:{...x.resources}}));
   const attacker=ps.find(x=>x.uid===uid),target=ps.find(x=>x.uid===targetUid);
   const original=r.players.find(x=>x.uid===targetUid);
   if(card.cardId==="tax")target.resources.gold=Math.max(0,target.resources.gold-2000);
   if(card.cardId==="blackout")target.resources.energy=Math.max(0,target.resources.energy-1);
   if(card.cardId==="protest")target.skipProduction=true;
   if(card.cardId==="thief"){
     const order=["wood","brick","energy"];let stolenKey=null;
     for(const k of order){if(original.resources[k]>0){stolenKey=k;break}}
     if(stolenKey){const take=Math.min(2,original.resources[stolenKey]);target.resources[stolenKey]-=take;attacker.resources[stolenKey]=(attacker.resources[stolenKey]||0)+take}
   }
   ps=ps.map(x=>x.uid===uid?attacker:x.uid===targetUid?target:x);
   ps=ps.map(x=>x.uid===uid?{...x,cards:x.cards.filter(c=>c.id!==cardId)}:x);
   const log=[`🃏 ${p.name} ใช้ "${card.n}" กับ ${target.name}`,...(r.log||[])].slice(0,10);
   const newR={...r,players:ps,log};
   const adv=advanceAfterAction(newR,false);
   await updateDoc(roomRef(),{players:ps,log,...adv});
   showPopup(`✅ ใช้ "${card.n}" กับ ${target.name} สำเร็จ!`);
 });
}
